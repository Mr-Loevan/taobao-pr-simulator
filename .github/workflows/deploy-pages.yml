name: Deploy attachment test to GitHub Pages

on:
  push:
    branches: [main, codex/deploy-attachment-v3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: attachment-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always --no-audit --no-fund
      - name: Check scoring and personalized reports
        run: npm test
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build public site
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base="${SITE_BASE_PATH}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@v4
